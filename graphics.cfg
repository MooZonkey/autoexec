//=============Ragdolls&Gibs===========

//This section will make ragdolls and gibs instantly disappear // No ragdolls + no gibs = better performance and visual clarity

cl\_ragdoll\_forcefade 1 


cl\_ragdoll\_collide 0

// Only works in singleplayer matches 


cl\_phys\_props\_enable 0 


cl\_phys\_props\_max 0

// (default 2048) 


props\_break\_max\_pieces 0 

violence\_agibs 0 

violence\_hgibs 0


//=============Experimental & Threading============= 

// Optimized for 64-bit Linux + Vulkan/DXVK

mod\_load\_anims\_async 1 

mod\_load\_mesh\_async 1 

mod\_load\_vcollide\_async 1 


host\_thread\_mode 1

// Enabled for stability on modern multicore Linux systems


r\_occlusion 0

//Enables or disables occlusion 


mod\_forcedata 0

//Disables async model loading 


cl\_detaildist 0

//Distance of detail 


cl\_detailfade 0

// Fading of detail 


cl\_drawmonitors 0

// Never enable


 cl\_ejectbrass 0

// Brass shell ejections from the minigun


lod\_TransitionDist -2 


flex\_smooth 0

//Disabling smoothing reduces instructions 


mat\_clipz 1

//Old radeon graphics hardware users should set this value to 0.



//=============Graphics============= 


//Main section. Optimized for Vulkan.

mat\_showlowresimage 0

//lowres textures actually consume more resources because of LOD fading. 


mat\_max\_worldmesh\_vertices 1024 

//reduces vertices (1024 minimum)


cl\_hud\_playerclass\_use\_playermodel 0

// makes the playermodel 2D on the HUD


mat\_vsync 0 

// Gets rid of some input lag and uncaps FPS





mat\_compressedtextures 1 

 //Due to spaghetti code, disabling texture compression causes war paint textures, engineer buildings, and certain weapons to black out.


mat\_disable\_fancy\_blending 1 

mat\_envmapsize 4 

mat\_envmaptgasize 4 

mat\_filterlightmaps 0 

mat\_filtertextures 0 

mat\_forceaniso 16 

tracer\_extra 0


// ===Finer AA settings.====

mat\_antialias 8

//Global enable/disable 


mat\_software\_aa\_quality 1

// Default is 9 

mat\_software\_aa\_strength 1 

mat\_software\_aa\_strength\_vgui 1 

mat\_software\_aa\_blur\_one\_pixel\_lines 0 

mat\_software\_aa\_edge\_threshold 1 


mat\_software\_aa\_tap\_offset 0

//Skipping this step reduces CPU instructions


mat\_monitorgamma 1.8 

// Controls brightness, try 1.8 to make it brighter or 2.2 to get it darker. Only works in fullscreen.


mat\_motion\_blur\_enabled 0 

mat\_parallaxmap 0


mat\_picmip -10 

// -10 = swagged out quality, 10 = worst quality. Sever defines the range.


mat\_bumpmap 0 

mat\_reducefillrate 1 

mat\_reduceparticles 1 

mat\_trilinear 0 

mat\_viewportscale 1 

mat\_viewportupscale 1 

//The above two commands will only provide a measurable performacne increase to exceptionally weak hardware. 


mat\_wateroverlaysize 1 

mat\_mipmaptextures 0 

mp\_decals 0 

// Sets limit to sprays, blood, and bullet holes. 


r\_rootlod 0 

// 4 is the lowest accepted range for TF2. 


r\_ambientboost 0 

r\_drawbatchdecals 0 

r\_drawtracers\_firstperson 0 

r\_renderoverlayfragment 0 

r\_3dsky 0 r\_ambientfactor 0 

r\_avglight 0 

cl\_show\_splashes 0 

r\_cheapwaterend 1 

r\_cheapwaterstart 1 

r\_decals 0 

r\_decalstaticprops 0 

r\_decal\_cullsize 1 

r\_drawdetailprops 0 

r\_drawmodeldecals 0 

r\_drawflecks 0 

r\_dynamic 0 

r\_flashlightdepthtexture 0 

r\_forcewaterleaf 1 

r\_lightaverage 0 

r\_maxnewsamples 1

//1 halves the number of passes conducted for dyanmic lighting processing 


r\_maxsampledist 0

//Trims lighting distance 


r\_propsmaxdist 0 

r\_staticprop\_lod 63 

r\_waterdrawreflection 0 

r\_waterdrawrefraction 0 

r\_waterforceexpensive 0 

r\_waterforcereflectentities 0 

r\_worldlightmin 0.001 

rope\_averagelight 0 

rope\_collide 0 

rope\_rendersolid 0 

rope\_shake 0 

rope\_smooth 0 

rope\_subdiv 0 

rope\_wind\_dist 0

muzzleflash\_light 0 

cl\_muzzleflash\_dlight\_1st 0 

cl\_jiggle\_bone\_framerate\_cutoff 0





//===========Lighting&Shadows=============

mat\_phong 0 

//adds cartoon-like lighting and reduces rocket trail particles //Drastically improves performance when disabled.


mat\_specular 0 

//Controls specularity. Setting this to 0 will dull out reflections, but also provides a large performance boost. 


mat\_disable\_lightwarp 1 

mat\_softwarelighting 0 

mat\_hdr\_level 0

r\_shadowrendertotexture 0 


r\_shadows 0 

//Globally enables/disables shadows 


r\_shadowmaxrendered 0 

r\_worldlights 0 

r\_rimlight 0


tf\_enable\_glows\_after\_respawn 0 

//Disabled to grant more FPS and provide a more immersive experience.



//================FACE&HEAD================

r\_eyes 0 

//Enables/disables eyes rendering 


r\_flex 0 

//Enables/disables face animations 


r\_teeth 0 

//Enables/disables teeth rendering 


anim\_3wayblend 0 

//Enables/disables animation smoothing 


ai\_expression\_optimization 1 

r\_glint\_procedural 0 


blink\_duration 0 

//Enables/disables blinking 


tf\_clientsideeye\_lookats 0 

//Enables/disables eye tracking phonemesnap 0


//====================Misc============================

fps\_max 700 

//This command should be maxed out as high as possible. Higher FPS = less end-to-end render latency.


in\_usekeyboardsampletime 1


con\_nprint\_bgalpha 255

// Disables console transparency con\_nprint\_bgborder 0 // Disables console border


echo "Graphical Optimization Module Loaded"

